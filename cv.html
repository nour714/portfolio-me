<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nour Eldin Wael | CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7ff;
            --panel: #ffffff;
            --text: #14233f;
            --muted: #5d6e90;
            --accent: #2f5dd5;
            --accent-hover: #244ab0;
            --border: #d7e2ff;
            --shadow: 0 24px 60px rgba(26, 63, 148, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", system-ui, -apple-system, Segoe UI, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(103, 139, 255, 0.16), transparent 54%),
                radial-gradient(circle at bottom left, rgba(132, 179, 255, 0.22), transparent 48%),
                var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2.2rem 1rem;
        }

        .cv-shell {
            width: min(980px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .cv-head {
            padding: 1.2rem 1.4rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .cv-actions {
            display: flex;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.15rem;
            font-weight: 600;
            font-size: 0.92rem;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(47, 93, 213, 0.25);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #eaf0ff;
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #dde7ff;
        }

        .cv-frame-wrap {
            height: min(80vh, 960px);
            background: #f9fbff;
            position: relative;
        }

        .cv-frame {
            border: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .cv-foot {
            padding: 0.85rem 1.3rem 1.1rem;
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            background: #fafcff;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem 0.6rem;
            }

            .cv-head {
                padding: 1rem;
            }

            .cv-actions {
                width: 100%;
            }

            .btn {
                flex: 1;
            }

            .cv-frame-wrap {
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div class="cv-shell">
        <header class="cv-head">
            <h1>My CV</h1>
            <div class="cv-actions">
                <a href="index.html" class="btn btn-secondary">Back To Home</a>
                <a href="cv.pdf" download="Nour_Eldin_Wael_CV.pdf" class="btn btn-primary">Download CV</a>
            </div>
        </header>

        <div class="cv-frame-wrap">
            <iframe class="cv-frame" src="cv.pdf#toolbar=1" title="Nour Eldin Wael CV">
                Your browser does not support PDF preview.
                <a href="cv.pdf" download="Nour_Eldin_Wael_CV.pdf">Download CV</a>.
            </iframe>
        </div>

        <p class="cv-foot">If preview does not appear, use the Download CV button.</p>
    </div>
</body>
</html>
